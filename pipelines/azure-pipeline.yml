trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '22.x'

stages:
  - stage: PR_Quality_Gates
    displayName: PR Quality Gates
    condition: eq(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: PRValidation
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: npm ci
            displayName: Install dependencies
          - script: npx playwright install --with-deps
            displayName: Install Playwright
          - script: npm run lint
            displayName: Lint
          - script: npm run test:unit
            displayName: Unit tests
          - script: npm run test:contract
            displayName: Contract tests
          - script: npm run test:smoke
            displayName: API smoke

  - stage: Release_Quality_Gates
    displayName: Release Quality Gates
    condition: ne(variables['Build.Reason'], 'PullRequest')
    jobs:
      - job: ReleaseValidation
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: npm ci
            displayName: Install dependencies
          - script: npx playwright install --with-deps
            displayName: Install Playwright
          - script: npm run test:regression
            displayName: Regression suite
          - script: |
              curl -sSL https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz | tar -xz
              sudo mv k6-v0.52.0-linux-amd64/k6 /usr/local/bin/k6
              npm run test:perf
            displayName: Performance smoke
          - script: npm run test:monitoring
            displayName: Monitoring checks
