name: qa-platform-quality-gates

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  pr-quality-gates:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Contract tests
        run: npm run test:contract
      - name: API smoke
        run: npm run test:smoke

  release-quality-gates:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Regression
        run: npm run test:regression
      - name: Performance smoke
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz | tar -xz
          sudo mv k6-v0.52.0-linux-amd64/k6 /usr/local/bin/k6
          npm run test:perf
      - name: Monitoring checks
        run: npm run test:monitoring
